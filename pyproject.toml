[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "supportflow-ai"
version = "0.1.0"
description = "Confidence-aware banking support ticket classification and routing prototype"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["supportflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
